add_newline = false

format  = """
$directory\
$nixshell\
$git_branch\
$git_status\
$shell
$character
"""

[character]
success_symbol = '[󰄾](bold green)'
error_symbol = '[󰄾](bold red)'

[directory]
read_only = " "

[git_branch]
symbol = ' '
ignore_branches = ['master', 'main']

format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
format = '[$all_status$ahead_behind]($style) '

deleted = ""
