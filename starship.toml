add_newline = false

format  = """
$directory\
$nixshell\
$git_branch\
$git_status\
$shell
$character
"""

[directory]
read_only = ""

[git_branch]
symbol = ' '
ignore_branches = ['master', 'main']

format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
format = '[$all_status$ahead_behind]($style) '

deleted = ""
