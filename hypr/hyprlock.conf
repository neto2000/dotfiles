general {
    ignore_empty_input = true
}

background {
    monitor =
    path = /usr/share/sddm/themes/sddm-astronaut-theme/Backgrounds/pixel_sakura_static.png   # only png supported for now
}

input-field {
    monitor =
    size = 250, 30
    outline_thickness = 0
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgba(20,20,20,0.2)
    inner_color = rgba(204,204,204,0.3)
    font_color = rgba(61, 73, 91, 1)
    font_family = arcadeclassic
    font_size = 14
    fade_on_empty = false
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = Password # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = 40 # -1 means complete rounding (circle/oval)
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    #fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    position = 0, -75
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = rgb(0,0,0)
    shadow_boost = 1.6
}

label {
    monitor =
    #clock #3d495b
    text = cmd[update:1000] echo "$TIME"
    color = rgba(61, 73, 91, 1)
    font_size = 80
    font_family = arcadeclassic
    font_weight = 900
    position = 0, 210
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +%A\ %d)"
    color = rgba(61, 73, 91, 1)
    font_size = 20
    font_family = arcadeclassic
    position = 0, 130
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}


label {
    monitor =
    text = $USER
    color = rgba(61, 73, 91, 1)
    font_size = 15
    font_family = arcadeclassic
    position = 0, -35
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

shape {
    monitor = 
    size = 250, 30
    color = rgba(204,204,204,0.2)
    position = 0, -35
    rounding = 40 # -1 means complete rounding (circle/oval)
    halign = center
    valign = center
}

